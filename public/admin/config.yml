# Sveltia CMS configuration. Served together with index.html at /admin/.
# Reference: https://sveltiacms.app/en/docs
# The comment below is what enables validation and autocomplete, both in editors
# with the YAML extension and in Sveltia itself, so keep it exactly as written.
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: vjFaLk/shubham-mehta-com
  branch: main
  # `base_url` is left at its default (https://api.netlify.com), so logging in goes
  # through Netlify's GitHub OAuth provider. That provider has to be installed once
  # in the Netlify UI — see the "Content editing" section of README.md.

# Where uploads are stored. src/assets/ (not public/) so Astro's asset pipeline
# optimises the images and the `image()` content schema helper can resolve them.
media_folder: src/assets/images

# Every collection below overrides `media_folder`/`public_folder` with a path
# relative to the entry file. That produces `../../assets/images/photo.jpg`, which
# is the form both `image()` frontmatter fields and relative Markdown image links
# need. An absolute path would not be resolved by Astro.

media_libraries:
  default:
    config:
      # Rename uploads to `my-photo.jpg` instead of keeping `My Photo (1).JPG`.
      # Spaces and parentheses in a path are a recurring source of broken images.
      slugify_filename: true

slug:
  encoding: ascii
  clean_accents: true

output:
  # Leave optional fields out of the frontmatter entirely rather than writing empty
  # strings. Required: the content schemas apply length limits to some optional
  # fields, and an empty string would fail those checks and break the build.
  omit_empty_optional_fields: true
  json:
    # Match Prettier's settings for this repo so CMS commits don't reformat.
    indent_size: 4

editor:
  # The preview pane cannot render Astro components, so it never quite matches the
  # real page. Set to `true` if a rough preview is more useful than the extra width.
  preview: false

# One-off files that aren't part of a collection.
singletons:
  - name: site_config
    label: Site settings
    icon: settings
    file: src/data/site-config.json
    format: json
    media_folder: ../assets/images
    public_folder: ../assets/images
    fields:
      - name: website
        label: Site URL
        widget: string
        type: url
        hint: Used for canonical URLs, the sitemap and the RSS feed. Changing it needs a rebuild, which saving here triggers.

      - name: title
        label: Site title
        widget: string

      - name: subtitle
        label: Subtitle
        widget: string
        required: false
        hint: Shown under the site title in the header.

      - name: description
        label: Description
        widget: text
        hint: Default meta description for pages that don't set their own.

      - name: avatar
        label: Avatar
        widget: object
        required: false
        collapsed: auto
        fields:
          - name: src
            label: Image
            widget: image
            required: false
          - name: alt
            label: Alt text
            widget: string
            required: false

      - name: image
        label: Social share image
        widget: object
        required: false
        collapsed: auto
        hint: Used for link previews when a page doesn't set its own SEO image.
        fields:
          - name: src
            label: Image
            widget: image
            required: false
          - name: alt
            label: Alt text
            widget: string
            required: false

      # Link lists all share the same {text, href} shape.
      - &nav_links
        name: headerNavLinks
        label: Header navigation
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.text}}'
        fields:
          - name: text
            label: Label
            widget: string
          - name: href
            label: URL
            widget: string

      - <<: *nav_links
        name: footerNavLinks
        label: Footer navigation

      - <<: *nav_links
        name: socialLinks
        label: Social links

      - name: hero
        label: Home page hero
        widget: object
        required: false
        collapsed: auto
        fields:
          - name: title
            label: Heading
            widget: string
            required: false
          - name: text
            label: Text
            widget: text
            required: false
            # Deliberately a plain textarea rather than the Markdown widget: the
            # rich text editor rewrites line breaks when it saves, and this text
            # relies on single newlines staying inside one paragraph.
            hint: Markdown is supported. A blank line starts a new paragraph.
          - name: image
            label: Image
            widget: object
            required: false
            collapsed: auto
            fields:
              - name: src
                label: Image
                widget: image
                required: false
              - name: alt
                label: Alt text
                widget: string
                required: false
              - name: caption
                label: Caption
                widget: string
                required: false
          - name: actions
            label: Buttons
            widget: list
            required: false
            collapsed: false
            summary: '{{fields.text}}'
            fields:
              - name: text
                label: Label
                widget: string
              - name: href
                label: URL
                widget: string

      - name: subscribe
        label: Newsletter form
        widget: object
        required: false
        collapsed: auto
        fields:
          - name: enabled
            label: Enabled
            widget: boolean
            default: false
            required: false
          - name: title
            label: Heading
            widget: string
            required: false
          - name: text
            label: Text
            widget: text
            required: false
          - name: form
            label: Form
            widget: object
            required: false
            collapsed: auto
            fields:
              - name: action
                label: Form action URL
                widget: string
                required: false
                hint: The endpoint your provider gives you, e.g. Mailchimp or Formspree. The form is hidden until this is set.
              - name: emailFieldName
                label: Email field name
                widget: string
                required: false
                hint: Defaults to `email`. Only change this if your provider expects something else.
              - name: hiddenFields
                label: Hidden fields
                widget: list
                required: false
                collapsed: false
                summary: '{{fields.name}}'
                fields:
                  - name: name
                    label: Name
                    widget: string
                  - name: value
                    label: Value
                    widget: string
              - name: honeypotFieldName
                label: Honeypot field name
                widget: string
                required: false
                hint: Optional anti-spam field. Leave empty unless your provider supports one.

      - name: postsPerPage
        label: Posts per page
        widget: number
        value_type: int
        min: 1
        default: 8

      - name: projectsPerPage
        label: Projects per page
        widget: number
        value_type: int
        min: 1
        default: 8

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    icon: article
    folder: src/content/blog
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    create: true
    preview_path: blog/{{slug}}
    preview_path_date_field: publishDate
    summary: '{{title}}'
    sortable_fields:
      - publishDate
      - title
    fields:
      - name: title
        label: Title
        widget: string

      - name: excerpt
        label: Excerpt
        widget: text
        required: false
        hint: Shown in post listings and used as the meta description when no SEO description is set.

      - name: publishDate
        label: Publish date
        widget: datetime
        type: date
        format: MMM D YYYY
        default: '{{now}}'

      - name: updatedDate
        label: Updated date
        widget: datetime
        type: date
        format: MMM D YYYY
        required: false

      - name: isFeatured
        label: Featured
        widget: boolean
        default: false
        required: false
        hint: Featured posts are highlighted on the home page.

      - name: tags
        label: Tags
        widget: list
        required: false
        default: []

      # Anchored here and reused by the other two collections — all three content
      # schemas share the same optional `seo` object.
      - &seo
        name: seo
        label: SEO
        widget: object
        required: false
        collapsed: auto
        fields:
          - name: title
            label: Title
            widget: string
            required: false
            maxlength: 120
            hint: Overrides the page title in search results. Use 5–120 characters, or leave empty.
          - name: description
            label: Description
            widget: text
            required: false
            maxlength: 160
            hint: Use 15–160 characters, or leave empty.
          - name: image
            label: Social image
            widget: object
            required: false
            collapsed: auto
            fields:
              - name: src
                label: Image
                widget: image
                required: false
              - name: alt
                label: Alt text
                widget: string
                required: false
                hint: Only used when an image is selected.
          - name: pageType
            label: Page type
            widget: select
            required: false
            options:
              - website
              - article

      - name: body
        label: Body
        widget: markdown
        required: false

  - name: projects
    label: Projects
    label_singular: Project
    icon: work
    folder: src/content/projects
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    create: true
    preview_path: projects/{{slug}}
    preview_path_date_field: publishDate
    summary: '{{title}}'
    sortable_fields:
      - publishDate
      - title
    fields:
      - name: title
        label: Title
        widget: string

      - name: description
        label: Description
        widget: text
        required: false
        hint: Shown in project listings and used as the meta description when no SEO description is set.

      - name: publishDate
        label: Publish date
        widget: datetime
        type: date
        format: MMM D YYYY
        default: '{{now}}'

      - name: isFeatured
        label: Featured
        widget: boolean
        default: false
        required: false
        hint: Featured projects are highlighted on the home page.

      - *seo

      - name: body
        label: Body
        widget: markdown
        required: false

  - name: pages
    label: Pages
    label_singular: Page
    icon: description
    description: Standalone pages such as About and Contact. A page is published at /<slug>; header and footer links are edited in src/data/site-config.ts.
    folder: src/content/pages
    media_folder: ../../assets/images
    public_folder: ../../assets/images
    create: true
    preview_path: '{{slug}}'
    summary: '{{title}}'
    fields:
      - name: title
        label: Title
        widget: string

      - *seo

      - name: body
        label: Body
        widget: markdown
        required: false
